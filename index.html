body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

.fc{display:block;width:100%;margin:6px 0;padding:14px;border-radius:16px;border:2px dashed var(--pk);background:var(--pk2);text-align:center}

.two{display:grid;grid-template-columns:1fr 1fr;gap:6px}.col{display:flex;flex-direction:column}.col .chip{margin:3px 0}

input.ok{border-color:var(--mt);background:var(--mt2)}input.bad{border-color:var(--rd);background:var(--rd2)}
.w{display:inline-block;font-size:12px;font-weight:700;background:var(--sn);color:#4a3a00;border-radius:8px;padding:1px 7px;margin-left:4px}
.go{margin-top:10px;background:var(--pk);color:#fff;border:0;border-radius:14px;padding:10px 18px;font-weight:700}

.bank{display:flex;flex-wrap:wrap}
.txt{background:var(--pk2);border-radius:14px;padding:6px 12px;margin-bottom:10px}
.boss{background:linear-gradient(135deg,var(--pk2),var(--mt2));border-radius:14px;padding:8px 12px;margin-bottom:8px}
.hp{height:10px;border-radius:8px;background:var(--card);overflow:hidden}.hp i{display:block;height:100%;width:100%;background:var(--rd);transition:width .3s}
.lv{color:var(--rd);letter-spacing:2px}
body.t2{--bg:#f1f0fc;--card:#fcfbff;--ink:#3d3b5c;--mut:#8582a8;--pk:#9b8bec;--pk2:#ebe7fc;--mt:#7fc3ee;--mt2:#e0f1fc;--sn:#b9aaf5;--rd:#f29aa8;--rd2:#fdebee;--ln:#dcd8f3}

body.t2 .w{color:#3d3b5c}
body.t3{--bg:#f3f9e9;--card:#fdfff9;--ink:#36503a;--mut:#7d9a7a;--pk:#68b546;--pk2:#e8f5d9;--mt:#4fb8a0;--mt2:#d9f3ea;--sn:#c5e17a;--rd:#f39a8a;--rd2:#fdeae6;--ln:#d8eac3}
body.t3 .hero{background:linear-gradient(135deg,#e4f5c9,#d3f0c2 55%,#c9f0e3)}
body.t3 .w{color:#36503a}
.ref{width:100%;border-collapse:collapse;font-size:12px}
.ref th,.ref td{border:1px solid var(--ln);padding:5px;vertical-align:top;text-align:left}
.ref th{background:var(--pk2)}.ref small{font-weight:400;color:var(--mut)}
.ref .ru{font-size:11px;margin:2px 0 0}
body.t4{--bg:#fff9e5;--card:#fffdf5;--ink:#5a4a2c;--mut:#a08c62;--pk:#e3b04a;--pk2:#fdf0c9;--mt:#8fcf9a;--mt2:#e3f6e6;--sn:#f6c978;--rd:#f4948a;--rd2:#fde8e4;--ln:#f3e4b8}

body.t4 .go,body.t4 .tab.on{color:#4a3510}
#tabs{display:none;gap:4px;max-width:520px;margin:0 auto 12px}
.tab{flex:1;background:var(--card);border:2px solid var(--ln);border-radius:14px;padding:8px 2px;font-weight:700;font-size:12px;color:var(--mut)}
.tab.on{background:var(--pk);border-color:var(--pk);color:#fff}
#fin{display:none;text-align:center;font-weight:700;padding:14px}
</style>
